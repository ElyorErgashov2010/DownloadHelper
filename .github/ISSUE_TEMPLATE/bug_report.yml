name: Xato haqida xabar
description: DownloadHelper'dagi haqiqiy xatoni qayta takrorlash qadamlari bilan yuborish
title: "[Xato]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Rahmat. Iltimos, xatoni aniq va rost ma'lumotlar bilan yozing.
        Parol, S3 kalit, token, private URL yoki decryption key kiritmang.
  - type: input
    id: version
    attributes:
      label: DownloadHelper versiyasi
      description: Masalan, v1.4.0 yoki test build sanasi.
      placeholder: v1.4.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows versiyasi
      description: Masalan, Windows 11 24H2 x64.
      placeholder: Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Xatoni qayta takrorlash qadamlari
      description: Qanday amallar xatoga olib keldi?
      placeholder: |
        1. Dastur ochildi
        2. Joylash tugmasi bosildi
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kutilgan natija
      placeholder: Nima bo'lishi kerak edi?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Aslida nima bo'ldi?
      placeholder: Xato matni yoki kuzatilgan holat.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshot yoki xavfsiz log qismi (ixtiyoriy)
      description: Maxfiy ma'lumotlarni avval o'chiring.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Maxfiylik
      options:
        - label: Men parol, token, S3 kalit, private URL yoki decryption key kiritmadim.
          required: true
