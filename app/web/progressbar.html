<!doctype html>
<!--
  progressbar.html — jonli «yashil to'lqin»li progress bar (Windows 7 uslubida).
  Asosiy oyna (index.html) uni iframe sifatida yuklaydi va postMessage bilan
  boshqaradi:  { type: 'state', value: 0..100, finished: null|true|false }

  Animatsiya faqat faol yuklash paytida (0 < foiz < 100) ishlaydi —
  idle (0%) va yakunlangan holatlarda CPU band qilinmaydi.
-->
<html lang="uz">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  const AMP = 5;    // to'lqin balandligi (px)
  const LEN = 34;   // bitta to'lqin davri (px)

  let value = 0;       // 0..100
  let finished = null; // null = davom etmoqda, true = muvaffaqiyat, false = xato
  let waveShift = 0;
  let tick = 0;
  let rafId = null;

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    const rect = canvas.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    ctx.clearRect(0, 0, W, H);
    if (W < 4 || H < 4) return;

    const bar = { x: 1, y: 1, w: W - 2, h: H - 2 };
    const rad = bar.h / 2;

    // Groove (pastki yo'l) — och kulrang gradient
    const g = ctx.createLinearGradient(0, bar.y, 0, bar.y + bar.h);
    g.addColorStop(0.0, "#c8c8c8");
    g.addColorStop(0.5, "#f1f1f1");
    g.addColorStop(1.0, "#d2d2d2");
    roundRect(bar.x, bar.y, bar.w, bar.h, rad);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#8c8c8c";
    ctx.stroke();

    // Yashil to'lqinli to'ldirish
    const v = Math.max(0, Math.min(100, value));
    const fw = bar.w * v / 100;
    if (fw >= 1) {
      ctx.save();
      roundRect(bar.x, bar.y, bar.w, bar.h, rad);
      ctx.clip();
      const fg = ctx.createLinearGradient(0, bar.y, 0, bar.y + bar.h);
      fg.addColorStop(0.0, "#7adf52");
      fg.addColorStop(0.5, "#5ec93f");
      fg.addColorStop(1.0, "#40a826");
      ctx.fillStyle = fg;
      ctx.fillRect(bar.x, bar.y, fw, bar.h);

      // To'lqin chizig'i
      ctx.strokeStyle = "#c4f1ad";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= fw; x += 1) {
        const px = bar.x + x;
        const py = bar.y + bar.h / 2 + AMP * Math.sin(((x - waveShift) / LEN) * Math.PI * 2);
        if (x === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();
    }

    // Foiz — markazda, oq
    ctx.fillStyle = "#ffffff";
    ctx.font = '600 13px "Segoe UI", sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,0.45)";
    ctx.shadowBlur = 3;
    ctx.fillText(Math.round(v) + "%", W / 2, H / 2);
    ctx.shadowBlur = 0;
  }

  // Windows 7 dagiga o'xshash nozik pulsatsiya
  function step() {
    tick += 0.03;
    const speed = 1.7 + 0.7 * Math.sin(tick * 1.6);
    waveShift = (waveShift + speed) % LEN;
    draw();
    rafId = requestAnimationFrame(step);
  }

  function syncAnim() {
    const active = finished === null && value > 0 && value < 100;
    if (active && !rafId) {
      rafId = requestAnimationFrame(step);
    } else if (!active && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
      waveShift = 0;
      tick = 0;
      draw();
    }
  }

  window.addEventListener("message", function (e) {
    const m = e.data || {};
    if (m.type === "state") {
      value = (typeof m.value === "number") ? m.value : 0;
      if (typeof m.finished === "boolean") {
        finished = m.finished;
        if (m.finished) value = 100;
      }
      syncAnim();
      draw();
    }
  });

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener("resize", resize);

  resize();
  // Tayyorligini asosiy oynaga xabar qila — undan keyin holat yuboriladi
  window.parent.postMessage({ type: "ready" }, "*");
})();
</script>
</body>
</html>
